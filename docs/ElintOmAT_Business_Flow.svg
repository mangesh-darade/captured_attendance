<rect x="100" y="1060" width="560" height="190" rx="12" fill="#fff" stroke="#B91C1C" stroke-width="2"/>
<text x="380" y="1127" text-anchor="middle" font-size="13" fill="#1F3A33" font-weight="700">Exceptions handled</text>
<text x="380" y="1143" text-anchor="middle" font-size="13" fill="#1F3A33" >- Face fails 3 times: &quot;Check in without face scan&quot; + manual request to manager</text>
<text x="380" y="1159" text-anchor="middle" font-size="13" fill="#1F3A33" >- No internet: punch saved as Pending, syncs later, &quot;Synced&quot; toast</text>
<text x="380" y="1175" text-anchor="middle" font-size="13" fill="#1F3A33" >- Unknown site: allowed and saved as new location</text>
<text x="380" y="1191" text-anchor="middle" font-size="13" fill="#1F3A33" >- Approved WFH day: punch is marked WFH</text>
<rect x="700" y="1060" width="560" height="190" rx="12" fill="#fff" stroke="#0E6B5C" stroke-width="2"/>
<text x="980" y="1127" text-anchor="middle" font-size="13" fill="#1F3A33" font-weight="700">Request lifecycle</text>
<text x="980" y="1143" text-anchor="middle" font-size="13" fill="#1F3A33" >Sent -&gt; Pending -&gt; Approved / Rejected (or Undone)</text>
<text x="980" y="1159" text-anchor="middle" font-size="13" fill="#1F3A33" >Leave approved: balance reduced</text>
<text x="980" y="1175" text-anchor="middle" font-size="13" fill="#1F3A33" >Correction approved: check-out applied</text>
<text x="980" y="1191" text-anchor="middle" font-size="13" fill="#1F3A33" >Late / can&#x27;t come clear after check-in</text>
<rect x="1300" y="1060" width="540" height="190" rx="12" fill="#fff" stroke="#7C3AED" stroke-width="2"/>
<text x="1570" y="1127" text-anchor="middle" font-size="13" fill="#1F3A33" font-weight="700">Business value</text>
<text x="1570" y="1143" text-anchor="middle" font-size="13" fill="#1F3A33" >- Trusted attendance (face + GPS + geofence)</text>
<text x="1570" y="1159" text-anchor="middle" font-size="13" fill="#1F3A33" >- Managers decide in one place, with context</text>
<text x="1570" y="1175" text-anchor="middle" font-size="13" fill="#1F3A33" >- Employee always knows the status</text>
<text x="1570" y="1191" text-anchor="middle" font-size="13" fill="#1F3A33" >- HR controls content without an app update</text></svg>