<line x1="270" y1="514" x2="300" y2="514" stroke="#0E6B5C" stroke-width="2.4"/>
<rect x="300" y="557" width="300" height="62" rx="12" fill="#fff" stroke="#0E6B5C" stroke-width="2"/>
