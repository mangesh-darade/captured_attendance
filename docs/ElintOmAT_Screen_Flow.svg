<text x="450" y="599" text-anchor="middle" font-size="12" fill="#1F3A33" >month, leave balance, requests, missed punch</text>
<line x1="270" y1="588" x2="300" y2="588" stroke="#0E6B5C" stroke-width="2.4"/>
<rect x="300" y="631" width="300" height="62" rx="12" fill="#fff" stroke="#7C3AED" stroke-width="2"/>
